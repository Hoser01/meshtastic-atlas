[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-server"
version = "0.3.25"
description = "Central ATLAS event ingestion and transmission correlation"
requires-python = ">=3.10"
license = "GPL-3.0-only"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[project.scripts]
atlas-server-ingest = "atlas_server.cli:main"
atlas-server = "atlas_server.run:main"
atlas-observer-token = "atlas_server.observer_admin:main"

[tool.setuptools.packages.find]
where = ["src"]
