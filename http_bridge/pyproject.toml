[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "meshtastic-http-bridge"
version = "0.1.2"
description = "Standalone Meshtastic HTTP PhoneAPI bridge for native TCP MUX endpoints"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [{name = "ATLAS contributors"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
meshtastic-http-bridge = "meshtastic_http_bridge.bridge:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
